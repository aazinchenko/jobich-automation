name: Tests (PR)

# 1. ТРИГГЕР: когда запускать?
on:
  pull_request:
    branches: [ main ]
  schedule:
    # Запуск в 0-ю минуту каждого часа (UTC)
    - cron: '0 * * * *'
  # Позволяет также нажимать кнопку "Run workflow" вручную из интерфейса
  workflow_dispatch:

# 2. ЗАДАЧИ: что именно делать?
jobs:
  smoke-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest # GitHub выделит чистую виртуальную машину на Linux

    steps:
      # Шаг 1: Скачиваем код из ветки PR на виртуальную машину
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Java 17 и настраиваем кэширование зависимостей Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # GitHub сохранит зависимости, чтобы не качать интернет заново при каждом запуске

      # Шаг 3: Запускаем сьют тестов
      - name: Execute TestNG Smoke Suite
        run: xvfb-run mvn test -DsuiteXmlFile=src/test/resources/testng.xml

      # 4 - новая конфигурация для запуска аллюр
      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy report history
        if: always()
        run: |
          mkdir -p target/allure-results/history
          cp -r gh-pages/history/* target/allure-results/history/ 2>/dev/null || true

      - name: Install Allure commandline
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure report
        if: always()
        run: allure generate target/allure-results --clean -o allure-report

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report